name: CI

# Runs quality gates on every push/PR: type safety, lint, unit tests, a
# DB-backed integration suite (see docs/ARCHITECTURE.md "Testing" section
# for scope — the integration suite runs against a real PostgreSQL
# database and exercises the actual transactional order/deposit/refund
# logic end-to-end), a production build, and finally a real-browser
# Playwright end-to-end suite that runs that same build against its own
# separate Postgres database (see e2e/global-setup.ts and
# docs/PRODUCTION_READINESS.md §15 — this closes what was the last
# remaining gap tracked there).
#
# Postgres/Prisma migration note: the original MongoDB version of this
# workflow used `mongodb-memory-server` to spin up disposable ephemeral
# MongoDB replica sets (with a binary-download cache step, since there's
# no first-class "Postgres/Mongo as a service" primitive as clean as this
# for Mongo replica sets). Postgres has no such complication — GitHub
# Actions' native `services:` container support runs a real, disposable
# `postgres` container for the life of the job, so both the integration
# and e2e jobs below just point DATABASE_URL/DIRECT_URL/E2E_DATABASE_URL
# at it. No download cache, no in-memory server library needed.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Typecheck, Lint, Test, Build, E2E
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Dependency vulnerability scan
        run: npm audit --audit-level=high

      - name: Unit tests
        run: npm run test

      - name: Create integration/e2e test databases
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -c "CREATE DATABASE telegram_panel_test;"
          psql -h localhost -U postgres -c "CREATE DATABASE telegram_panel_e2e;"

      - name: Push schema to integration test database
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/telegram_panel_test?schema=public"
          DIRECT_URL: "postgresql://postgres:postgres@localhost:5432/telegram_panel_test?schema=public"
        run: npx prisma db push --accept-data-loss

      - name: Integration tests (DB-backed, real Postgres)
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/telegram_panel_test?schema=public"
          DIRECT_URL: "postgresql://postgres:postgres@localhost:5432/telegram_panel_test?schema=public"
          AUTH_SECRET: "ci-only-placeholder-secret-not-for-real-use-000000"
        run: npm run test:integration

      - name: Push schema to e2e test database
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/telegram_panel_e2e?schema=public"
          DIRECT_URL: "postgresql://postgres:postgres@localhost:5432/telegram_panel_e2e?schema=public"
        run: npx prisma db push --accept-data-loss

      - name: Build
        # Dummy env values so `next build` (which loads lib/env.ts at import
        # time for some routes) doesn't fail validation in CI. These are not
        # real secrets and are never used to contact a real service.
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/telegram_panel_test?schema=public"
          DIRECT_URL: "postgresql://postgres:postgres@localhost:5432/telegram_panel_test?schema=public"
          AUTH_SECRET: "ci-only-placeholder-secret-not-for-real-use-000000"
          AUTH_TRUST_HOST: "true"
          NEXT_PUBLIC_APP_URL: "http://localhost:3000"
          NODE_ENV: "production"
        run: npm run build

      - name: Install Playwright's Chromium browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests (Playwright, against the just-built app)
        # `e2e/global-setup.ts` wipes/reseeds the dedicated
        # telegram_panel_e2e database (schema already pushed above) and
        # spawns its own `next start` server process with its own env vars
        # (see that file's header comment) — nothing from the Build step's
        # placeholder env above is reused here, and this never touches a
        # real/production database. The build from the previous step is
        # reused as-is (see docs/PRODUCTION_READINESS.md §15 for why
        # `config.webServer` isn't used).
        env:
          E2E_DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/telegram_panel_e2e?schema=public"
        run: npx playwright test
